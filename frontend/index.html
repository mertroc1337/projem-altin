<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altın Wallet - Profesyonel Portföy Takibi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #0f172a; padding: 20px; color: #e2e8f0; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; }
    
    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #1e293b; }
    h1 { font-size: 26px; font-weight: 800; color: #fbbf24; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
    .logout-btn { background: #334155; color: #e2e8f0; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; transition: 0.2s; }
    .logout-btn:hover { background: #475569; }
    
    /* Status Badge */
    .status-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .status-pill { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .status-online { background: #064e3b; color: #34d399; border: 1px solid #059669; }
    .status-offline { background: #450a0a; color: #f87171; border: 1px solid #dc2626; }
    .status-warn { background: #451a03; color: #fbbf24; border: 1px solid #d97706; }
    .dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot-green { background: #34d399; animation: pulse 1.5s infinite; }
    .dot-red { background: #f87171; }
    .dot-yellow { background: #fbbf24; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    
    /* Summary Cards */
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
    @media (max-width: 640px) { .summary { grid-template-columns: 1fr; } }
    .summary-box { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid #334155; border-radius: 14px; padding: 20px; text-align: center; position: relative; overflow: hidden; }
    .summary-box::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #fbbf24; opacity: 0.3; }
    .summary-label { font-size: 12px; color: #94a3b8; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .summary-value { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .green { color: #34d399 !important; }
    .red { color: #f87171 !important; }
    .white { color: #f8fafc !important; }
    
    /* Cards */
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
    .card h2 { font-size: 15px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; color: #f1f5f9; font-weight: 700; }
    
    /* Price List */
    .price-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #334155; transition: 0.15s; }
    .price-row:hover { background: #0f172a; margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .price-row:last-child { border-bottom: none; }
    .price-name { font-weight: 600; font-size: 14px; color: #e2e8f0; }
    .price-right { text-align: right; }
    .price-sell { font-weight: 700; font-size: 15px; color: #fbbf24; font-variant-numeric: tabular-nums; }
    .price-buy { font-size: 12px; color: #64748b; margin-top: 2px; }
    .price-change { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; margin-left: 8px; }
    .change-up { background: #064e3b; color: #34d399; }
    .change-down { background: #450a0a; color: #f87171; }
    
    /* Form */
    .form-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    input, select { padding: 12px 14px; background: #0f172a; border: 1px solid #475569; border-radius: 10px; font-size: 14px; color: #e2e8f0; flex: 1; min-width: 140px; outline: none; transition: 0.2s; }
    input:focus, select:focus { border-color: #fbbf24; }
    button[type="submit"] { padding: 12px 24px; background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0f172a; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; width: 100%; }
    button[type="submit"]:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3); }
    
    /* Portfolio */
    .investment-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #334155; gap: 12px; }
    .investment-item:last-child { border-bottom: none; }
    .invest-info { flex: 1; min-width: 0; }
    .invest-title { font-weight: 700; font-size: 14px; color: #f1f5f9; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .invest-detail { font-size: 12px; color: #64748b; margin-top: 4px; }
    .invest-pnl { text-align: right; min-width: 110px; }
    .pnl-value { font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
    .pnl-percent { font-size: 12px; font-weight: 700; margin-top: 2px; }
    .badge { font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 700; }
    .badge-buy { background: #064e3b; color: #34d399; }
    .badge-sell { background: #450a0a; color: #f87171; }
    .delete-btn { background: #450a0a; color: #f87171; padding: 6px 12px; font-size: 12px; font-weight: 600; border-radius: 8px; border: 1px solid #7f1d1d; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .delete-btn:hover { background: #7f1d1d; }
    
    .empty { text-align: center; color: #475569; padding: 32px; font-size: 14px; }
    
    /* Auth */
    .auth-box { max-width: 400px; margin: 80px auto; background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid #334155; padding: 40px; border-radius: 16px; }
    .auth-box h2 { text-align: center; margin-bottom: 28px; font-size: 24px; color: #fbbf24; }
    .auth-box input { width: 100%; margin-bottom: 14px; background: #0f172a; }
    .auth-box button { width: 100%; margin-top: 8px; }
    .auth-box p { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
    .link { color: #fbbf24; cursor: pointer; font-weight: 700; }
    .link:hover { text-decoration: underline; }
    
    /* Skeleton Loading */
    .skeleton { background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; height: 16px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
